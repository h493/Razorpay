spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/razorpay}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:Pass@123}
  data:
    redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASS:Pass@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.add.type.headers: false
        spring.json.trusted.packages: "com.capstone.razorpay.*"
        spring.json.value.default.type: java.util.LinkedHashMap
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3


payment:
  order:
    default-order-expiry-minutes: 45
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

vault:
  master-key: nKCLYvAZp7F37LiCGU6qzesmecuFM1ZW3IRDUF7xS3Y=

jwt:
  secret-key: asdsfhsnsfjsadjiosdjasjdasndsdjoasjdopasdsavcifdfjdontuseinprod

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2

  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events

  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100

